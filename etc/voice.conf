#
# Buzonera — vgetty / módem Conexant CX93010 (V.253)
#

part generic

voice_log_level 5
voice_shell_log /var/log/vgetty_voice_shell.%s
voice_dir /var/spool/voice
phone_owner root
phone_group voice
phone_mode 0660
message_flag_file .flag
receive_dir incoming
message_dir messages
message_list Index
backup_message standard.rmd

# Misma velocidad que mgetty.config
port_speed 115200

voice_shell /bin/bash
port_timeout 15
dial_timeout 90
command_delay 100
dtmf_wait 7

raw_data false
rec_compression 0
rec_speed 0
rec_silence_len 50
rec_silence_threshold 40
rec_remove_silence false
rec_max_len 180
rec_min_len 1
do_hard_flow true

beep_frequency 933
beep_length 1200
max_tries 3
retry_delay 5
watchdog_timeout 90
receive_gain -1
transmit_gain -1
enable_command_echo false
poll_interval 10

forceV253 TRUE
enable_compression_mapping_querry TRUE

rings 3
answer_mode voice
toll_saver_rings 0
rec_always_keep true

button_program
call_program
dtmf_program
# Script post-grabación: convierte, transcribe y envía correo
message_program /opt/buzonera/bin/on_message.sh

do_message_light false
ring_report_delay 15

program vm
voice_devices ttyACM0
dialout_timeout 90
ringback_goes_away 70
ringback_never_came 100

program pvf

port ttyACM0
rings 3
answer_mode voice

ring_type ring
rings 3
answer_mode voice
